# Postgres (state storage) + Redis (counters) for the postgres-redis example.
# Non-default host ports so they don't collide with services you already run.
#   docker compose up -d     # then: bun run demo
#   docker compose down -v   # when done
name: xtandard-entitlements-example
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: entitlements
      POSTGRES_PASSWORD: entitlements
      POSTGRES_DB: entitlements
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitlements"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
